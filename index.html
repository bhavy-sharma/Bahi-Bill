<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Bahi Bill</title>
<meta name="description" content="Make a GST bill in a minute, then print it or save it as PDF. Works offline.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
<style id="page-style">@page{size:A4 portrait;margin:10mm}</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="#0E6B5C"/><path d="M10 7.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4z" fill="#F4FBF9"/><path d="M13 12.5h6M13 16h6M13 19.5h3.5" stroke="#0E6B5C" stroke-width="1.6" stroke-linecap="round"/></svg><span>Bahi <b>Bill</b></span></span>
    <div class="top-acts">
      <button type="button" class="btn ghost" id="act-new"><span class="ic-plus" aria-hidden="true">+</span><span>New bill</span></button>
      <button type="button" class="btn" id="act-pdf"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11M7.5 10.5 12 15l4.5-4.5M4.5 17v3h15v-3"/></svg><span>PDF</span></button>
      <button type="button" class="btn primary" id="act-print"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3.5h10V9"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><path d="M7 14h10v6.5H7z"/></svg><span>Print</span></button>
    </div>
  </div>
</header>
<nav class="tabs-m" aria-label="View">
  <button type="button" data-pane="form" aria-pressed="true">Fill details</button>
  <button type="button" data-pane="preview" aria-pressed="false">See bill</button>
</nav>
<main class="layout" id="layout" data-pane="form">
  <section class="form-pane" id="form" aria-label="Bill details"></section>
  <section class="preview-pane" aria-label="Bill preview">
    <div class="paper-wrap" id="paper-wrap"><div class="paper-fit" id="paper-fit"></div></div>
  </section>
</main>
<div id="print-area"></div>
<div id="pdf-stage" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/vendor/qrcode.js"></script>
<script src="js/vendor/html2pdf.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
